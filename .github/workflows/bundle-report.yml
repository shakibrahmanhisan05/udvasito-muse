name: bundle-report

# X03 (specs §7.1): export the production web bundle and measure the
# initial shell against the 600 KB gzip budget. P6 measured a single
# entry bundle at 1,161,418 B gzip (over budget). P7 enabled Expo
# Router async routes (route-based splitting) plus lazy Sentry/push
# and zod-locale pruning; scripts/measure-bundle.mjs now measures the
# first-screen total (index.html scripts + root-layout chunk + the
# `/` route chunk) — see docs/dev/P7-REPORT.md for the numbers. It is
# deliberately not a required status check yet; it exists so every PR
# shows the real number.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bundle:
    name: web bundle size vs 600 KB budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production web export
        run: npm run build:web
      - name: Measure initial shell (gzip)
        run: node scripts/measure-bundle.mjs
