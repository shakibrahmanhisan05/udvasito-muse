name: Android local build

# Manual fallback for the EAS free quota (roadmap §2.4): builds the APK on
# GitHub's Ubuntu runner (free for public repositories) and attaches it as an
# artifact. Requires the EXPO_TOKEN repository secret.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [development, preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Build APK locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --non-interactive --platform android --profile ${{ inputs.profile }} --output ./udvasito-${{ inputs.profile }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: udvasito-${{ inputs.profile }}-apk
          path: ./udvasito-${{ inputs.profile }}.apk
